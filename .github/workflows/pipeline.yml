# ===================================================================
# PROXMOX CI/CD PIPELINE - Infrastruktur-Automatisierung
# ===================================================================
# 📌 WAS PASSIERT HIER?
#   Diese Pipeline automatisiert den gesamten Infrastruktur-Lebenszyklus:
#   1️ Packer baut ein Ubuntu-22.04-Template in Proxmox
#   2️ Checkov prüft Terraform-Code (HARTES GATE - bricht bei Fehlern ab)
#   3️ Terraform deployed VM aus dem Template
#   4️ Checkov scannt Ansible (Beobachtungsmodus - kein Abbruch)
#   5️ Ansible konfiguriert Nginx-Webserver auf der VM
#
#  Erstellt am:         2026-06-27
#  Letzte Änderung am:  2026-09-13 
#  Autor:          Randolph Bluming
#  Repository:     GitHub Actions (self-hosted Runner)
#  Trigger:        Push auf main (nur bei Änderungen in packer/, terraform/, ansible/)


# ===================================================================
# PIPELINE-KONFIGURATION
# ===================================================================
name: Proxmox CI/CD Pipeline

# ===================================================================
# TRIGGER-BEDINGUNGEN
# ===================================================================
# Pipeline startet automatisch bei bestimmten Ereignissen.
# ===================================================================
on:
  # Push auf main – nur bei Änderungen in relevanten Verzeichnissen
  push:
    branches: [main]
    paths:
      - 'packer/**'          # Packer-Konfiguration für VM-Template
      - 'terraform/**'       # Terraform-Code für VM-Deployment
      - 'ansible/**'         # Ansible-Playbooks für Konfiguration
      - '.github/workflows/pipeline.yml'  # Diese Pipeline-Datei selbst
  
  # Pull-Requests auf main – gleiche Pfad-Filter
  pull_request:
    branches: [main]
    paths:
      - 'packer/**'
      - 'terraform/**'
      - 'ansible/**'
      - '.github/workflows/pipeline.yml'

  # Manueller Start über GitHub-Actions-UI
  # Ermöglicht Testen auf Feature-Branch ohne Push/PR auf main
  workflow_dispatch:
    
# ===================================================================
# SICHERHEITSBERECHTIGUNGEN
# Minimale Rechte (Prinzip der geringsten Privilegien)
# ===================================================================
permissions:
  contents: read  # Nur Lesezugriff auf Repository-Inhalte

# ===================================================================
# PIPELINE-JOBS
# ===================================================================
jobs:
  # =================================================================
  # JOB 0: GEÄNDERTE DATEIEN ERKENNEN
  # =================================================================
  # Stellt fest, welche Verzeichnisse sich geändert haben
  # (packer/, terraform/, ansible/).
  # Ergebnis: Drei true/false-Werte zur Steuerung der Folg ejobs.
  # =================================================================
  detect-changes:
    runs-on: [self-hosted, proxmox]
    outputs:
      packer: ${{ steps.filter.outputs.packer }}
      terraform: ${{ steps.filter.outputs.terraform }}
      ansible: ${{ steps.filter.outputs.ansible }}

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Repository auschecken
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false  # Verhindert Löschen der terraform.tfstate im Workspace

      # ---------------------------------------------------------------
      # Schritt 2: Geänderte Pfade erkennen
      # ---------------------------------------------------------------
      - name: Geänderte Pfade erkennen
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packer:
              - 'packer/**'
              - '.github/workflows/pipeline.yml'
            terraform:
              - 'terraform/**'
              - '.github/workflows/pipeline.yml'
            ansible:
              - 'ansible/**'
              - '.github/workflows/pipeline.yml'

  # =================================================================
  # JOB 1: VM-TEMPLATE MIT PACKER BAUEN
  # =================================================================
  # Erstellt ein Ubuntu-22.04-Template in Proxmox (~10-15 Min).
  # Ergebnis: Template "ubuntu-2204-template" in Proxmox.
  # =================================================================
  build-template:
    # Self-hosted Runner im Proxmox-Netzwerk → direkter Zugriff
    needs: detect-changes
    if: needs.detect-changes.outputs.packer == 'true'
    runs-on: [self-hosted, proxmox]
    outputs:
      new_template_id: ${{ steps.get-template-id.outputs.template_id }}

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false  # Verhindert Löschen des Workspace-Caches

      # ---------------------------------------------------------------
      # Schritt 2: Packer-Installation prüfen
      # ---------------------------------------------------------------
      - name: Packer Version prüfen
        run: packer version

      # ---------------------------------------------------------------
      # Schritt 3: Packer-Plugins installieren
      # ---------------------------------------------------------------
      # Proxmox-Plugin für Packer (definiert in ubuntu-2204.pkr.hcl
      # unter required_plugins).
      - name: Packer Plugins installieren
        run: |
          cd packer
          packer init .

      # ---------------------------------------------------------------
      # Schritt 4: Packer-Template validieren
      # ---------------------------------------------------------------
      # Prüft Syntax/Konfiguration ohne Build – fängt Fehler früh ab.
      - name: Packer Template validieren
        run: |
          cd packer
          packer validate .
        env:
          # Proxmox-Authentifizierung (Packer liest via ${env(...)})
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
          PACKER_TOKEN_ID: ${{ secrets.PACKER_TOKEN_ID }}
          PACKER_TOKEN_SECRET: ${{ secrets.PACKER_TOKEN_SECRET }}

      # ---------------------------------------------------------------
      # Schritt 5: Packer-Template bauen
      # ---------------------------------------------------------------
      # Packer startet VM, führt Provisioner aus, konvertiert zu Template.
      - name: Packer Template bauen
        run: |
          cd packer
          packer build .
        env:
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
          PACKER_TOKEN_ID: ${{ secrets.PACKER_TOKEN_ID }}
          PACKER_TOKEN_SECRET: ${{ secrets.PACKER_TOKEN_SECRET }}
          
      # ---------------------------------------------------------------
      # Schritt 6: Vergebene Template-ID auslesen
      # ---------------------------------------------------------------
      # - artifact_id des letzten Builds (immer der aktuelle)
      # - "local:123" → "123"
      # - Keine Netzwerkabhängigkeit, stabiler/schneller
      # - Muss NACH dem Build laufen
      - name: Vergebene Template-ID auslesen
        id: get-template-id
        run: |
          cd packer
          TEMPLATE_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d: -f2)
          echo "Gefundene Template-ID: $TEMPLATE_ID"
          echo "template_id=$TEMPLATE_ID" >> "$GITHUB_OUTPUT"

  # =================================================================
  # JOB 2: SECURITY-GATE MIT CHECKOV
  # =================================================================
  # always(): Job startet auch bei Fehler/Abbruch von build-template.
  # Zweite Bedingung: nur bei 'success' oder 'skipped' ausführen –
  # bei 'failure'/'cancelled' wird Scan übersprungen (kein toter Code).
  # =================================================================
  security-scan:
    needs: build-template
    if: |
      always() &&
      (needs.build-template.result == 'success' || needs.build-template.result == 'skipped')
    runs-on: [self-hosted, proxmox]

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Checkov-Installation prüfen
      # ---------------------------------------------------------------
      - name: Checkov Version prüfen
        run: checkov --version

      # ---------------------------------------------------------------
      # Schritt 3: Checkov Security-Scan durchführen
      # ---------------------------------------------------------------
      # Terraform-Scan mit Custom-Checks.
      # Kein "|| true" / continue-on-error → FAILED bricht Job ab
      # (verhindert Deployment unsicherer Infrastruktur).
      - name: Checkov Security-Gate (Custom Proxmox-Checks)
        run: |
          # -d terraform                → Scan-Verzeichnis
          # --external-checks-dir ...   → Custom-Checks
          # --compact                   → Kompakte Ausgabe
          checkov -d terraform --external-checks-dir terraform/checks --compact

  # =================================================================
  # JOB 3: VM MIT TERRAFORM DEPLOYEN
  # =================================================================
  # Erstellt VM aus dem zuvor gebauten Template.
  # Wartet auf build-template UND security-scan.
  # Ergebnis: VM läuft in Proxmox mit IP-Adresse.
  # always()-Fix: läuft auch bei übersprungenem Packer-Build weiter.
  # =================================================================
  deploy-vm:
    needs: [build-template, security-scan]
    if: |
      always() &&
      (needs.build-template.result == 'success' || needs.build-template.result == 'skipped') &&
      needs.security-scan.result == 'success'
    runs-on: [self-hosted, proxmox]

    # =============================================================
    # OUTPUTS: IP-Adressen für nachfolgende Jobs
    # =============================================================
    outputs:
      vm_ip: ${{ steps.get-ip.outputs.vm_ip }}          # Web-Server IP
      db_vm_ip: ${{ steps.get-ip.outputs.db_vm_ip }}    # DB-Server IP
      test_vm_ip: ${{ steps.get-ip.outputs.test_vm_ip }} # Wegwerf-Test-VM IP

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Terraform-Installation prüfen
      # ---------------------------------------------------------------
      - name: Terraform Version prüfen
        run: terraform version

      # ---------------------------------------------------------------
      # Schritt 3: Terraform initialisieren
      # ---------------------------------------------------------------
      # Provider/Plugins laden.
      # Fallback test_template_id:
      #   Normalfall: neue ID aus build-template überschreibt Default
      #   Ausnahme: build-template übersprungen → leer → Default 2000
      - name: Terraform initialisieren
        run: |
          cd terraform
          if [ -n "${{ needs.build-template.outputs.new_template_id }}" ]; then
            export TF_VAR_test_template_id="${{ needs.build-template.outputs.new_template_id }}"
          fi
          terraform init
        env:
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_URL }}
          TF_VAR_pm_api_token_id: ${{ secrets.TF_VAR_PM_API_TOKEN_ID }}
          TF_VAR_pm_api_token_secret: ${{ secrets.TF_VAR_PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      # ---------------------------------------------------------------
      # Schritt 4: Terraform Plan anzeigen
      # ---------------------------------------------------------------
      # Zeigt geplante Änderungen (ohne Ausführung).
      - name: Terraform Plan anzeigen
        run: |
          cd terraform
          # Fallback-Logik: siehe "Terraform initialisieren"
          if [ -n "${{ needs.build-template.outputs.new_template_id }}" ]; then
            export TF_VAR_test_template_id="${{ needs.build-template.outputs.new_template_id }}"
          fi
          terraform plan
        env:
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_URL }}
          TF_VAR_pm_api_token_id: ${{ secrets.TF_VAR_PM_API_TOKEN_ID }}
          TF_VAR_pm_api_token_secret: ${{ secrets.TF_VAR_PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      # ---------------------------------------------------------------
      # Schritt 5: VM deployen
      # ---------------------------------------------------------------
      # Eigentliche VM-Erstellung (ohne manuelle Bestätigung).
      - name: VM deployen
        run: |
          cd terraform
          # Fallback-Logik: siehe "Terraform initialisieren"
          if [ -n "${{ needs.build-template.outputs.new_template_id }}" ]; then
            export TF_VAR_test_template_id="${{ needs.build-template.outputs.new_template_id }}"
          fi
          terraform apply -auto-approve
        env:
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_URL }}
          TF_VAR_pm_api_token_id: ${{ secrets.TF_VAR_PM_API_TOKEN_ID }}
          TF_VAR_pm_api_token_secret: ${{ secrets.TF_VAR_PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      # ---------------------------------------------------------------
      # Schritt 6: VM IP-Adressen auslesen
      # ---------------------------------------------------------------
      # IPs aus Terraform-Outputs lesen und weitergeben.
      - name: VM IP-Adresse auslesen
        id: get-ip  # wird in "outputs" referenziert
        run: |
          cd terraform

          # 2>/dev/null unterdrückt Fehler bei fehlendem Output
          VM_IP=$(terraform output -raw vm_ip 2>/dev/null)
          DB_VM_IP=$(terraform output -raw db_server_ip 2>/dev/null)
          TEST_VM_IP=$(terraform output -raw test_vm_ip 2>/dev/null)

          # Sicherheitscheck: Abbruch bei fehlenden IPs
          # (verhindert Arbeit mit leeren Werten)
          if [ -z "$VM_IP" ] || [ -z "$DB_VM_IP" ] || [ -z "$TEST_VM_IP" ]; then
            echo "❌ FEHLER: Eine oder mehrere IPs fehlen!"
            echo "  vm_ip: '$VM_IP'"
            echo "  db_server_ip: '$DB_VM_IP'"
            echo "  test_vm_ip: '$TEST_VM_IP'"
            echo "Prüfe ob outputs.tf korrekt konfiguriert ist."
            exit 1
          fi

          echo "✅ VM IP gefunden: $VM_IP"
          echo "✅ DB-Server IP gefunden: $DB_VM_IP"
          echo "✅ Test-VM IP gefunden: $TEST_VM_IP"

          # IPs als Output für Folg ejobs bereitstellen
          echo "vm_ip=$VM_IP" >> $GITHUB_OUTPUT
          echo "db_vm_ip=$DB_VM_IP" >> $GITHUB_OUTPUT
          echo "test_vm_ip=$TEST_VM_IP" >> $GITHUB_OUTPUT

  # =================================================================
  # JOB 4: ANSIBLE SECURITY-SCAN (BEOBACHTUNGSMODUS)
  # =================================================================
  # Prüft Ansible-Playbooks auf Sicherheitsprobleme.
  # SOFT-FAIL: zeigt Findings, bricht Pipeline aber NICHT ab.
  # =================================================================
  ansible-security-scan:
    needs: deploy-vm
    runs-on: [self-hosted, proxmox]

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Checkov-Installation prüfen
      # ---------------------------------------------------------------
      - name: Checkov Version prüfen
        run: checkov --version

      # ---------------------------------------------------------------
      # Schritt 3: Ansible-Scan durchführen (Beobachtungsmodus)
      # ---------------------------------------------------------------
      # continue-on-error: Job gilt als erfolgreich, auch wenn Checkov
      # fehlschlägt → configure-vm wird NICHT blockiert.
      - name: Checkov Ansible-Scan (Beobachtungsmodus)
        continue-on-error: true
        run: |
          # -d ansible                 → Scan-Verzeichnis
          # --framework ansible        → Nur Ansible
          # --external-checks-dir ...  → Custom-Checks
          # --compact                  → Kompakte Ausgabe
          checkov -d ansible --framework ansible --external-checks-dir ansible/checks --compact

  # =================================================================
  # JOB 5: VM MIT ANSIBLE KONFIGURIEREN
  # =================================================================
  # Installiert/konfiguriert Software auf den VMs.
  # Wartet auf deploy-vm UND ansible-security-scan (Soft-Fail möglich).
  # Ergebnis: Nginx läuft → Webseite erreichbar.
  # =================================================================
  configure-vm:
    needs: [deploy-vm, ansible-security-scan]
    runs-on: [self-hosted, proxmox]

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Ansible-Installation prüfen
      # ---------------------------------------------------------------
      - name: Ansible Version prüfen
        run: ansible --version

      # ---------------------------------------------------------------
      # Schritt 3: SSH-Key für Ansible einrichten
      # ---------------------------------------------------------------
      # Privaten SSH-Key aus Secrets in Datei schreiben.
      # Eigener Dateiname (nicht id_ed25519) → vermeidet Konflikte.
      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/gh_actions_deploy_key
          chmod 600 ~/.ssh/gh_actions_deploy_key

      # ---------------------------------------------------------------
      # Schritt 4: Warten bis VMs erreichbar sind
      # ---------------------------------------------------------------
      # Prüft SSH-Verfügbarkeit (max. 30 Versuche).
      # Verhindert Zugriff auf noch nicht fertige VMs.
      - name: Warten bis VM erreichbar ist
        env:
          VM_IP: ${{ needs.deploy-vm.outputs.vm_ip }}
          DB_VM_IP: ${{ needs.deploy-vm.outputs.db_vm_ip }}
          TEST_VM_IP: ${{ needs.deploy-vm.outputs.test_vm_ip }}
        run: |
          declare -A SERVERS=(
          ["webserver"]="$VM_IP"
          ["dbserver"]="$DB_VM_IP"
          ["testserver"]="$TEST_VM_IP"
          )

          for NAME in "${!SERVERS[@]}"; do
            IP="${SERVERS[$NAME]}"

            echo "Warte auf $NAME: $IP"

            SSH_OK=false  # KEIN $ bei Zuweisung!
            for i in {1..30}; do
                # -o StrictHostKeyChecking=no → Host-Key automatisch akzeptieren
                # -i ...                       → privater SSH-Key
                # 'echo ok'                    → Testbefehl auf dem Server
                if ssh -o StrictHostKeyChecking=no \
                       -o ConnectTimeout=5 \
                       -i ~/.ssh/gh_actions_deploy_key \
                       ansible@$IP 'echo ok' 2>/dev/null ; then
                    echo "✅ $NAME ist erreichbar!"
                    SSH_OK=true  # KEIN $ bei Zuweisung!
                    break
                fi
                echo "Versuch $i/30 - warte 10 Sekunden..."
                sleep 10
            done

            if [ "$SSH_OK" = false ]; then  # $ beim LESEN!
                echo "❌ FEHLER: $NAME nach 30 Versuchen nicht erreichbar!"
                exit 1
            fi
          done

      # ---------------------------------------------------------------
      # Schritt 5: SSH-Fingerabdruck speichern
      # ---------------------------------------------------------------
      # Host-Keys in known_hosts speichern.
      # Verhindert interaktive "Are you sure?"-Frage bei SSH.
      - name: SSH Fingerabdruck speichern
        env:
          VM_IP: ${{ needs.deploy-vm.outputs.vm_ip }}
          DB_VM_IP: ${{ needs.deploy-vm.outputs.db_vm_ip }}
          TEST_VM_IP: ${{ needs.deploy-vm.outputs.test_vm_ip }}
        run: |
          declare -A SERVERS=(
          ["webserver"]="$VM_IP"
          ["dbserver"]="$DB_VM_IP"
          ["testserver"]="$TEST_VM_IP"
          )

          for NAME in "${!SERVERS[@]}"; do
          IP="${SERVERS[$NAME]}"
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts
          done

      # ---------------------------------------------------------------
      # Schritt 6: Ansible Playbook ausführen
      # ---------------------------------------------------------------
      # Inventory aus aktuellen IPs erstellen und Playbook ausführen.
      # Inventory wird bei jedem Pipeline-Run neu geschrieben.
      - name: Ansible Playbook ausführen
        env:
          VM_IP: ${{ needs.deploy-vm.outputs.vm_ip }}
          DB_VM_IP: ${{ needs.deploy-vm.outputs.db_vm_ip }}
          TEST_VM_IP: ${{ needs.deploy-vm.outputs.test_vm_ip }}
          # Host-Key-Check deaktiviert (bereits per ssh-keyscan erledigt)
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          cd ansible
          declare -A SERVERS=(
           ["webserver"]="$VM_IP"
           ["dbserver"]="$DB_VM_IP"
           ["testserver"]="$TEST_VM_IP"
            )

          > inventory.ini  # Datei für diesen Lauf leeren/anlegen

          for NAME in "${!SERVERS[@]}"; do
           IP="${SERVERS[$NAME]}"
           cat >> inventory.ini << EOF
          [$NAME]
          $IP ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/gh_actions_deploy_key

          EOF
          done

          cat >> inventory.ini << EOF
          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

          # -i inventory.ini      → erstelltes Inventory
          # --user ansible        → SSH-User
          # --private-key ...     → privater SSH-Key
          ansible-playbook -i inventory.ini playbook.yml \
            --user ansible \
            --private-key ~/.ssh/gh_actions_deploy_key

      # ---------------------------------------------------------------
      # Schritt 7: SSH-Key aufräumen
      # ---------------------------------------------------------------
      # SSH-Key nach Pipeline löschen (Sicherheit).
      # if: always() → läuft IMMER, auch bei Fehlern.
      - name: SSH-Key aufräumen
        if: always()
        run: rm -f ~/.ssh/gh_actions_deploy_key

  # =================================================================
  # JOB 6: TEMPLATE FREIGEBEN (PROMOTION)
  # =================================================================
  # Markiert das getestete Template als "freigegeben", NACHDEM
  # configure-vm (inkl. Play 3, Stichprobenprüfung Test-VM) erfolgreich
  # war. Setzt einen Proxmox-Tag am Template + dokumentiert die
  # Freigabe mit Datum und Commit-SHA im Repo.
  # =================================================================
  promote-template:
    needs: [build-template, configure-vm]
    if: needs.configure-vm.result == 'success'
    runs-on: [self-hosted, proxmox]
    permissions:
      contents: write  # NUR dieser Job darf ins Repo committen

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Template in Proxmox als "promoted" markieren
      # ---------------------------------------------------------------
      - name: Template taggen
        run: |
          curl -k -X PUT \
            "${{ secrets.PROXMOX_URL }}api2/json/nodes/${{ secrets.PROXMOX_NODE }}/qemu/${{ needs.build-template.outputs.new_template_id }}/config" \
            -H "Authorization: PVEAPIToken=${{ secrets.PROMOTION_TOKEN_ID }}=${{ secrets.PROMOTION_TOKEN_SECRET }}" \
            -d "tags=promoted"

      # ---------------------------------------------------------------
      # Schritt 3: Freigabe protokollieren
      # ---------------------------------------------------------------
      - name: Freigabe protokollieren
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) | Template ${{ needs.build-template.outputs.new_template_id }} | Commit ${{ github.sha }} | Play-3-Test bestanden" >> docs/promotion-log.md
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/promotion-log.md
          git commit -m "Promotion: Template ${{ needs.build-template.outputs.new_template_id }}"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}