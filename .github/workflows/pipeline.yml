# ===================================================================
# PROXMOX CI/CD PIPELINE - Infrastruktur-Automatisierung
# ===================================================================
# 📌 WAS PASSIERT HIER?
#   Diese Pipeline automatisiert den gesamten Infrastruktur-Lebenszyklus:
#   1️ Packer baut ein Ubuntu-22.04-Template in Proxmox
#   2️ Checkov prüft Terraform-Code (HARTES GATE - bricht bei Fehlern ab)
#   3️ Terraform deployed VM aus dem Template
#   4️ Checkov scannt Ansible (Beobachtungsmodus - kein Abbruch)
#   5️ Ansible konfiguriert Nginx-Webserver auf der VM
#
#  Erstellt am:       2026-06-27
#  Letzte Änderung am:2026-08-23 
#  Autor:          Randolph Bluming
#  Repository:     GitHub Actions (self-hosted Runner)
#  Trigger:        Push auf main (nur bei Änderungen in packer/, terraform/, ansible/)
# ===================================================================

# ===================================================================
# PIPELINE-KONFIGURATION
# ===================================================================
name: Proxmox CI/CD Pipeline

# ===================================================================
# TRIGGER-BEDINGUNGEN
# ===================================================================
# Die Pipeline startet automatisch bei bestimmten Ereignissen
# ===================================================================
on:
  # Bei Push auf den main-Branch
  push:
    branches: [main]
    # Nur wenn sich Dateien in diesen Verzeichnissen geändert haben
    paths:
      - 'packer/**'          # Packer-Konfiguration für VM-Template
      - 'terraform/**'       # Terraform-Code für VM-Deployment
      - 'ansible/**'         # Ansible-Playbooks für Konfiguration
      - '.github/workflows/pipeline.yml'  # Diese Pipeline-Datei selbst
  
  # Bei Pull-Requests auf den main-Branch
  pull_request:
    branches: [main]
    # Gleiche Pfad-Filter wie beim Push
    paths:
      - 'packer/**'
      - 'terraform/**'
      - 'ansible/**'
      - '.github/workflows/pipeline.yml'

# ===================================================================
# SICHERHEITSBERECHTIGUNGEN
# ===================================================================
# Minimale Rechte für die Pipeline (Prinzip der geringsten Privilegien)
# ===================================================================
permissions:
  contents: read  # Nur Lesezugriff auf Repository-Inhalte

# ===================================================================
# PIPELINE-JOBS
# ===================================================================
jobs:

  # =================================================================
  # JOB 1: VM-TEMPLATE MIT PACKER BAUEN
  # =================================================================
  # Ziel: Erstellt ein fertiges Ubuntu-22.04-Template in Proxmox
  # Dauer: ca. 10-15 Minuten
  # Ergebnis: Template "ubuntu-2204-template" liegt in Proxmox
  # =================================================================
  build-template:
    # Läuft auf einem selbst-gehosteten Runner in deinem Proxmox-Netzwerk
    # Dadurch kann der Runner direkt auf Proxmox zugreifen
    runs-on: [self-hosted, proxmox]
    outputs:
      new_template_id: ${{ steps.get-template-id.outputs.template_id }}  # ID des erstellten Templates

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code vom Repository herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false  # Verhindert Löschen des Workspace-Caches

      # ---------------------------------------------------------------
      # Schritt 2: Packer-Installation prüfen
      # ---------------------------------------------------------------
      - name: Packer Version prüfen
        run: packer version  # Gibt die installierte Packer-Version aus

      # ---------------------------------------------------------------
      # Schritt 3: Packer-Plugins installieren
      # ---------------------------------------------------------------
      # Lädt das Proxmox-Plugin für Packer herunter
      # Die Plugins sind in ubuntu-2204.pkr.hcl unter required_plugins definiert
      - name: Packer Plugins installieren
        run: |
          cd packer               # In das Packer-Verzeichnis wechseln
          packer init .          # Plugins basierend auf .pkr.hcl installieren

      # ---------------------------------------------------------------
      # Schritt 4: Packer-Template validieren
      # ---------------------------------------------------------------
      # Prüft die Syntax und Konfiguration ohne zu bauen
      # Fängt Fehler frühzeitig ab
      - name: Packer Template validieren
        run: |
          cd packer
          packer validate .      # Validiert alle .pkr.hcl Dateien
        env:
          # Umgebungsvariablen für die Proxmox-Authentifizierung
          # Packer liest diese mit ${env("PROXMOX_PASSWORD")}
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
          PACKER_TOKEN_ID: ${{ secrets.PACKER_TOKEN_ID }}
          PACKER_TOKEN_SECRET: ${{ secrets.PACKER_TOKEN_SECRET }}

            
      # ---------------------------------------------------------------
      # Schritt 5: Packer-Template bauen
      # ---------------------------------------------------------------
      # Jetzt wird das Template wirklich erstellt
      # Packer: 
      #   - Startet eine VM aus dem Ubuntu-ISO
      #   - Führt die Provisioner (Shell-Skripte) aus
      #   - Konvertiert die VM in ein Template
      - name: Packer Template bauen
        run: |
          cd packer
          packer build .          # Baut das Template laut .pkr.hcl
        env:
          # Authentifizierung für Proxmox während des Builds
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
          PACKER_TOKEN_ID: ${{ secrets.PACKER_TOKEN_ID }}
          PACKER_TOKEN_SECRET: ${{ secrets.PACKER_TOKEN_SECRET }}
          
      # ---------------------------------------------------------------
      # Schritt 6: Vergebene Template-ID auslesen
      # ---------------------------------------------------------------
      # ---- NEUE VARIANTE (aktiv) ----
      # Extraktion direkt aus Packer-manifest.json
      #    │
      #    └── Wechsel ins packer-Verzeichnis
      #        → jq -r '.builds[-1].artifact_id' manifest.json
      #            Extrahiert die artifact_id des letzten Builds
      #            (der aktuelle Packer-Build ist immer der letzte Eintrag)
      #        → cut -d: -f2
      #            Trennt an ":" und nimmt den zweiten Teil
      #            Beispiel: "local:123" → "123"
      #        → Keine Netzwerkabhängigkeit mehr → schneller und stabiler
      #        → Funktioniert in jeder Umgebung (lokal, CI/CD, etc.)
      #        → WICHTIG: Der Schritt muss NACH dem Packer-Build ausgeführt werden

      - name: Vergebene Template-ID auslesen
        id: get-template-id
        run: |
          cd packer
          TEMPLATE_ID=$(jq -r '.builds[-1].artifact_id' manifest.json | cut -d: -f2)
          echo "Gefundene Template-ID: $TEMPLATE_ID"
          echo "template_id=$TEMPLATE_ID" >> "$GITHUB_OUTPUT"

  # =================================================================
  # JOB 2: SECURITY-GATE MIT CHECKOV
  # =================================================================
  # Ziel: Sicherheitsscan des Terraform-Codes BEVOR deployt wird
  # Wartet auf: build-template
  # Verhalten: HARTES GATE - bricht Pipeline bei Fehlern ab
  # =================================================================
  security-scan:
    needs: build-template  # Startet erst wenn Job 1 erfolgreich war
    runs-on: [self-hosted, proxmox]

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code vom Repository herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Checkov-Installation prüfen
      # ---------------------------------------------------------------
      - name: Checkov Version prüfen
        run: checkov --version

      # ---------------------------------------------------------------
      # Schritt 3: Checkov Security-Scan durchführen
      # ---------------------------------------------------------------
      # Scannt den Terraform-Code mit eigenen Custom-Checks
      # WICHTIG: Kein "|| true" oder "continue-on-error"
      # → Bei FAILED-Checks bricht der Job mit Exit-Code 1 ab
      # → Verhindert dass unsichere Infrastruktur deployt wird
      - name: Checkov Security-Gate (Custom Proxmox-Checks)
        run: |
          # -d terraform                    → Verzeichnis für Scan
          # --external-checks-dir ...       → Eigene Custom-Checks einbinden
          # --compact                      → Kompakte Ausgabe
          checkov -d terraform --external-checks-dir terraform/checks --compact


  # =================================================================
  # JOB 3: VM MIT TERRAFORM DEPLOYEN
  # =================================================================
  # Ziel: Erstellt eine VM aus dem zuvor gebauten Template
  # Wartet auf: build-template UND security-scan (beide erfolgreich)
  # Ergebnis: VM läuft in Proxmox mit einer IP-Adresse
  # =================================================================
  deploy-vm:
    needs: [build-template, security-scan]  # Wartet auf beide Jobs
    runs-on: [self-hosted, proxmox]

    # =============================================================
    # OUTPUTS: IP-Adressen für nachfolgende Jobs
    # =============================================================
    # Die IPs werden aus Terraform ausgelesen und an Job 3 und 4 weitergegeben
    outputs:
      vm_ip: ${{ steps.get-ip.outputs.vm_ip }}          # Web-Server IP
      db_vm_ip: ${{ steps.get-ip.outputs.db_vm_ip }}    # DB-Server IP
      test_vm_ip: ${{ steps.get-ip.outputs.test_vm_ip }} # Wegwerf-Test-VM IP (Phase 2B.2)
      

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code vom Repository herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Terraform-Installation prüfen
      # ---------------------------------------------------------------
      - name: Terraform Version prüfen
        run: terraform version

      # ---------------------------------------------------------------
      # Schritt 3: Terraform initialisieren
      # ---------------------------------------------------------------
      # Lädt den Proxmox-Provider und andere benötigte Plugins herunter
      # Wichtig: TF_VAR_* Umgebungsvariablen werden zu Terraform-Variablen
      - name: Terraform initialisieren
        run: |
          cd terraform
          terraform init
        env:
          # TF_VAR_pm_api_url → var.pm_api_url in Terraform
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_URL }}
          TF_VAR_pm_api_token_id: ${{ secrets.TF_VAR_PM_API_TOKEN_ID }}
          TF_VAR_pm_api_token_secret: ${{ secrets.TF_VAR_PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_test_template_id: ${{ needs.build-template.outputs.new_template_id }}

      # ---------------------------------------------------------------
      # Schritt 4: Terraform Plan anzeigen
      # ---------------------------------------------------------------
      # Zeigt was Terraform tun WILL (ohne Änderungen durchzuführen)
      # Gut zum Verständnis und zur Kontrolle der Änderungen
      - name: Terraform Plan anzeigen
        run: |
          cd terraform
          terraform plan
        env:
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_URL }}
          TF_VAR_pm_api_token_id: ${{ secrets.TF_VAR_PM_API_TOKEN_ID }}
          TF_VAR_pm_api_token_secret: ${{ secrets.TF_VAR_PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_test_template_id: ${{ needs.build-template.outputs.new_template_id }}

      # ---------------------------------------------------------------
      # Schritt 5: VM deployen
      # ---------------------------------------------------------------
      # Führt die eigentliche Erstellung der VM durch
      # -auto-approve: Keine manuelle Bestätigung notwendig (automatisiert)
      - name: VM deployen
        run: |
          cd terraform
          terraform apply -auto-approve
        env:
          TF_VAR_pm_api_url: ${{ secrets.PROXMOX_URL }}
          TF_VAR_pm_api_token_id: ${{ secrets.TF_VAR_PM_API_TOKEN_ID }}
          TF_VAR_pm_api_token_secret: ${{ secrets.TF_VAR_PM_API_TOKEN_SECRET }}
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_test_template_id: ${{ needs.build-template.outputs.new_template_id }}
      # ---------------------------------------------------------------
      # Schritt 6: VM IP-Adressen auslesen
      # ---------------------------------------------------------------
      # Liest die IP-Adressen aus Terraform-Outputs
      # Speichert sie für die nachfolgenden Jobs (Ansible)
      - name: VM IP-Adresse auslesen
        id: get-ip                    # Wichtig: Diese ID wird in "outputs" referenziert
        run: |
          cd terraform

          # IP-Adressen aus Terraform-Outputs lesen
          # 2>/dev/null unterdrückt Fehlermeldungen falls Output nicht existiert
          VM_IP=$(terraform output -raw vm_ip 2>/dev/null)
          DB_VM_IP=$(terraform output -raw db_server_ip 2>/dev/null)
          TEST_VM_IP=$(terraform output -raw test_vm_ip 2>/dev/null)

          # ============================================================
          # SICHERHEITSCHECK: Prüfung ob IPs vorhanden sind
          # ============================================================
          # Falls keine IP gefunden wurde → Pipeline abbrechen
          # Verhindert dass mit falschen/leeren IPs weitergearbeitet wird
          if [ -z "$VM_IP" ] || [ -z "$DB_VM_IP" ] || [ -z "$TEST_VM_IP" ]; then
            echo "❌ FEHLER: Eine oder mehrere IPs fehlen!"
            echo "  vm_ip: '$VM_IP'"
            echo "  db_server_ip: '$DB_VM_IP'"
            echo "  test_vm_ip: '$TEST_VM_IP'"
            echo "Prüfe ob outputs.tf korrekt konfiguriert ist."
            exit 1
          fi

          echo "✅ VM IP gefunden: $VM_IP"
          echo "✅ DB-Server IP gefunden: $DB_VM_IP"
          echo "✅ Test-VM IP gefunden: $TEST_VM_IP"
          
          # IPs in GitHub-Actions-Output schreiben
          # Dadurch werden sie an nachfolgende Jobs weitergegeben
          echo "vm_ip=$VM_IP" >> $GITHUB_OUTPUT
          echo "db_vm_ip=$DB_VM_IP" >> $GITHUB_OUTPUT
          echo "test_vm_ip=$TEST_VM_IP" >> $GITHUB_OUTPUT


  # =================================================================
  # JOB 4: ANSIBLE SECURITY-SCAN (BEOBACHTUNGSMODUS)
  # =================================================================
  # Ziel: Ansible-Playbooks auf Sicherheitsprobleme prüfen
  # Wartet auf: deploy-vm
  # Verhalten: SOFT-FAIL - zeigt Findings, bricht aber NICHT ab
  # =================================================================
  ansible-security-scan:
    needs: deploy-vm  # Wartet bis die VM deployed ist
    runs-on: [self-hosted, proxmox]

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code vom Repository herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Checkov-Installation prüfen
      # ---------------------------------------------------------------
      - name: Checkov Version prüfen
        run: checkov --version

      # ---------------------------------------------------------------
      # Schritt 3: Ansible-Scan durchführen (Beobachtungsmodus)
      # ---------------------------------------------------------------
      # continue-on-error: true → Job gilt als erfolgreich, auch wenn Checkov fehlschlägt
      # Dadurch wird der nachfolgende configure-vm Job NICHT blockiert
      # Ermöglicht Beobachtung ohne Deployment-Block
      - name: Checkov Ansible-Scan (Beobachtungsmodus)
        continue-on-error: true
        run: |
          # -d ansible                       → Verzeichnis für Scan
          # --framework ansible             → Nur Ansible scannen
          # --external-checks-dir ...       → Eigene Custom-Checks einbinden
          # --compact                       → Kompakte Ausgabe
          checkov -d ansible --framework ansible --external-checks-dir ansible/checks --compact

  
  # =================================================================
  # JOB 5: VM MIT ANSIBLE KONFIGURIEREN
  # =================================================================
  # Ziel: Software auf der VM installieren und konfigurieren
  # Wartet auf: deploy-vm UND ansible-security-scan (Soft-Fail möglich)
  # Ergebnis: Nginx läuft auf der VM → Webseite erreichbar
  # =================================================================
  configure-vm:
    # Wartet auf beide Jobs (auch wenn security-scan Soft-Fail hatte)
    needs: [deploy-vm, ansible-security-scan]
    runs-on: [self-hosted, proxmox]

    steps:
      # ---------------------------------------------------------------
      # Schritt 1: Code vom Repository herunterladen
      # ---------------------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          clean: false

      # ---------------------------------------------------------------
      # Schritt 2: Ansible-Installation prüfen
      # ---------------------------------------------------------------
      - name: Ansible Version prüfen
        run: ansible --version

      # ---------------------------------------------------------------
      # Schritt 3: SSH-Key für Ansible einrichten
      # ---------------------------------------------------------------
      # Schreibt den privaten SSH-Key aus GitHub Secrets in eine Datei
      # Wichtig: Eigener Dateiname (nicht id_ed25519) um Konflikte zu vermeiden
      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh                      # .ssh-Verzeichnis erstellen
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/gh_actions_deploy_key  # Key speichern
          chmod 600 ~/.ssh/gh_actions_deploy_key  # Nur Leserechte für aktuellen User

      # ---------------------------------------------------------------
      # Schritt 4: Warten bis VMs erreichbar sind
      # ---------------------------------------------------------------
      # Prüft ob SSH auf den VMs verfügbar ist (max. 30 Versuche)
      # Verhindert dass Ansible auf noch nicht fertige VMs zugreift
      - name: Warten bis VM erreichbar ist
        env:
          VM_IP: ${{ needs.deploy-vm.outputs.vm_ip }}          # Web-Server IP
          DB_VM_IP: ${{ needs.deploy-vm.outputs.db_vm_ip }}    # DB-Server IP
          TEST_VM_IP: ${{ needs.deploy-vm.outputs.test_vm_ip }}  # Test-VM IP
        run: |
          declare -A SERVERS=(
          ["webserver"]="$VM_IP"
          ["dbserver"]="$DB_VM_IP"
          ["testserver"]="$TEST_VM_IP"
          )
            # für den aktuellen Server-Namen aus dem Array
            for NAME in "${!SERVERS[@]}"; do
            IP="${SERVERS[$NAME]}"
        
            echo "Warte auf $NAME: $IP"
        
            SSH_OK=false  # KEIN $ bei Zuweisung!
            for i in {1..30}; do
                # -o StrictHostKeyChecking=no \
                # Akzeptiert automatisch den SSH-Host-Key 
                # (fragt nicht nach Bestätigung)
                # -i ~/.ssh/gh_actions_deploy_key \
                # Benutzt diesen privaten SSH-Key zur Authentifizierung
                # 'echo ok' = Führt auf dem Server den Befehl echo ok aus 
                # (Test, ob SSH funktioniert)
                if ssh -o StrictHostKeyChecking=no \
                       -o ConnectTimeout=5 \
                       -i ~/.ssh/gh_actions_deploy_key \
                       ansible@$IP 'echo ok' 2>/dev/null ; then
                    echo "✅ $NAME ist erreichbar!"
                    SSH_OK=true  # KEIN $ bei Zuweisung!
                    break
                fi
                echo "Versuch $i/30 - warte 10 Sekunden..."
                sleep 10
            done
        
            if [ "$SSH_OK" = false ]; then  # $ beim LESEN des Werts!
                echo "❌ FEHLER: $NAME nach 30 Versuchen nicht erreichbar!"
                exit 1
            fi
            done

      # ---------------------------------------------------------------
      # Schritt 5: SSH-Fingerabdruck speichern
      # ---------------------------------------------------------------
      # Speichert den Host-Key der VM in known_hosts
      # Verhindert die interaktive "Are you sure?" Frage bei SSH
      - name: SSH Fingerabdruck speichern
        env:
          VM_IP: ${{ needs.deploy-vm.outputs.vm_ip }}
          DB_VM_IP: ${{ needs.deploy-vm.outputs.db_vm_ip }}
          TEST_VM_IP: ${{ needs.deploy-vm.outputs.test_vm_ip }}  # Test-VM IP
        run: |
          declare -A SERVERS=(
          ["webserver"]="$VM_IP"
          ["dbserver"]="$DB_VM_IP"
          ["testserver"]="$TEST_VM_IP"
          )

          for NAME in "${!SERVERS[@]}"; do
          IP="${SERVERS[$NAME]}"
          ssh-keyscan -H "$IP" >> ~/.ssh/known_hosts 
          done

      # ---------------------------------------------------------------
      # Schritt 6: Ansible Playbook ausführen
      # ---------------------------------------------------------------
      # Führt das Ansible-Playbook aus, das die VMs konfiguriert
      # Installiert Nginx, konfiguriert Services etc.
      - name: Ansible Playbook ausführen
        env:
          VM_IP: ${{ needs.deploy-vm.outputs.vm_ip }}
          DB_VM_IP: ${{ needs.deploy-vm.outputs.db_vm_ip }}
          TEST_VM_IP: ${{ needs.deploy-vm.outputs.test_vm_ip }}
          ANSIBLE_HOST_KEY_CHECKING: "False"  # Deaktiviert Host-Key-Checking (wird von ssh-keyscan übernommen)
        run: |
          cd ansible
          # Erstellt eine inventory.ini mit den aktuellen IP-Adressen
          # Wird bei jedem Pipeline-Run neu geschrieben
          declare -A SERVERS=(
           ["webserver"]="$VM_IP"
           ["dbserver"]="$DB_VM_IP"
           ["testserver"]="$TEST_VM_IP"
            )

          > inventory.ini   # Datei leeren/anlegen für diesen Lauf

          for NAME in "${!SERVERS[@]}"; do
           IP="${SERVERS[$NAME]}"
           cat >> inventory.ini << EOF
          [$NAME]
          $IP ansible_user=ansible ansible_ssh_private_key_file=~/.ssh/gh_actions_deploy_key

          EOF
          done

          cat >> inventory.ini << EOF
          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          EOF

          # ============================================================
          # PLAYBOOK AUSFÜHREN
          # ============================================================
          # -i inventory.ini                 → Verwendet das erstellte Inventory
          # --user ansible                  → SSH-User für Verbindung
          # --private-key ...              → Pfad zum privaten SSH-Key
          ansible-playbook -i inventory.ini playbook.yml \
            --user ansible \
            --private-key ~/.ssh/gh_actions_deploy_key

      # ---------------------------------------------------------------
      # Schritt 7: SSH-Key aufräumen
      # ---------------------------------------------------------------
      # Löscht den privaten SSH-Key nach der Pipeline
      # if: always() → Läuft IMMER, auch wenn vorherige Steps fehlschlagen
      # Wichtig für die Sicherheit: Key wird nicht auf dem Runner belassen
      - name: SSH-Key aufräumen
        if: always()
        run: rm -f ~/.ssh/gh_actions_deploy_key