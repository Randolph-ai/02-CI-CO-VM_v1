# ============================================================
# ANSIBLE PLAYBOOK - WEB- & DB-SERVER KONFIGURATION
# ============================================================
# Autor:           Randolph Bluming
# Erstellt am:     2026-06-29
# Letzte Änderung: 2026-08-02
# Funktion:        Vollständige Konfiguration von Web- und DB-Server
# Ziel-VMs:        web-server-prod (10.0.30.101)
#                  db-server-prod  (10.0.30.102)
# Wird aufgerufen: GitHub Actions Pipeline (Job 5: configure-vm)
# ============================================================
#
# WAS DIESES PLAYBOOK TUT (Überblick):
#   PLAY 1 - Web-Server:
#     1. System-Pakete aktualisieren
#     2. Nginx installieren
#     3. Firewall (UFW) konfigurieren
#     4. Nginx starten & für Autostart aktivieren
#     5. Eine eigene index.html erstellen (mit Hostname/IP)
#     6. Prüfen ob Nginx wirklich antwortet
#
#   PLAY 2 - DB-Server:
#     1. System-Pakete aktualisieren
#     2. PostgreSQL installieren
#     3. PostgreSQL für Netzwerkzugriff konfigurieren
#     4. Firewall (UFW) mit IP-Einschränkung aktivieren
#     5. PostgreSQL starten & für Autostart aktivieren
#     6. Prüfen ob PostgreSQL antwortet
#
# IDEMPOTENZ-PRINZIP:
#   Dieses Playbook kann beliebig oft ausgeführt werden.
#   Ansible prüft vor jedem Task ob die Aktion nötig ist.
#   - Nginx/PostgreSQL schon installiert? → Task wird übersprungen
#   - Dienst läuft schon? → Task wird übersprungen
#   - Firewall-Regel existiert schon? → Task wird übersprungen
#
# SICHERHEITSKONZEPT (Defence in Depth für DB-Server):
#   1. listen_addresses = '*'  → PostgreSQL lauscht überall
#   2. pg_hba.conf             → Erlaubt NUR Web-Server-IP
#   3. UFW-Firewall            → Blockiert alle anderen Ports
#
# ABHÄNGIGKEITEN:
#   - VMs müssen laufen und SSH erreichbar sein
#   - SSH-Key muss in GitHub Secrets hinterlegt sein
#   - Python3 muss auf den VMs installiert sein
# ============================================================

# ============================================================
# PLAY-DEFINITION
# ============================================================
# Verbindet eine Server-Gruppe mit Tasks. Hier: alle Server
# aus Gruppe "webserver" in inventory.ini.
# ============================================================
# ============================================================
# PLAY 1: WEB-SERVER KONFIGURATION
# ============================================================
# ZWECK:   Installiert und konfiguriert Nginx auf dem Web-Server.
#          Erstellt eine dynamische index.html mit Hostname und IP.
#          Aktiviert die Firewall und gibt SSH/HTTP frei.
#
# BETRIFFT: Nur Gruppe "webserver" aus inventory.ini
# ============================================================
- name: Basis-Setup Web-Server
  hosts: webserver
  become: true

  tasks:

    # ==========================================================
    # TASK 1: PAKETLISTEN AKTUALISIEREN
    # ==========================================================
    # ZWECK:   Aktualisiert den apt-Cache, damit nachfolgende
    #          Installationen die neuesten Pakete finden.
    #
    # WICHTIG: Kein "upgrade: dist" – das würde in der Pipeline
    #          unkontrolliert alle Pakete aktualisieren und könnte
    #          unerwartete Änderungen verursachen.
    #          Wir wollen NUR den Cache aktualisieren.
    #
    # cache_valid_time: 3600 → 1 Stunde gültig, spart Zeit
    # ==========================================================
    - name: Paketlisten aktualisieren
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # ==========================================================
    # TASK 2: NGINX INSTALLIEREN
    # ==========================================================
    # ZWECK:   Installiert Nginx aus den Ubuntu-Repositories.
    #
    # state: present → installiert, aber aktualisiert nicht
    #          (im Gegensatz zu "latest")
    # ==========================================================
    - name: Nginx installieren
      apt:
        name: nginx
        state: present

    # ==========================================================
    # TASK 3: UFW FIREWALL AKTIVIEREN
    # ==========================================================
    # ZWECK:   Schaltet die Uncomplicated Firewall ein.
    #          Default: Alle eingehenden Verbindungen blockiert.
    #
    # state: enabled → persistent über Neustarts
    # logging: 'on' → einfaches Logging für Debugging
    #
    # WICHTIG: Aktiviert NACHDEM wir SSH freigegeben haben
    #          (siehe Task 4) – sonst Aussperrung!
    # ==========================================================
    - name: UFW Firewall aktivieren
      ufw:
        state: enabled
        logging: 'on'

    # ==========================================================
    # TASK 4: SSH-PORT FREIGEBEN
    # ==========================================================
    # ZWECK:   Erlaubt eingehende SSH-Verbindungen (Port 22).
    #
    # MUSS vor "ufw enable" stehen, sonst Aussperrung!
    #
    # name: OpenSSH → UFW kennt vordefinierte Profile
    #          → entspricht Port 22/tcp
    # ==========================================================
    - name: SSH Port freigeben (damit wir nicht ausgesperrt werden!)
      ufw:
        rule: allow
        name: OpenSSH

    # ==========================================================
    # TASK 5: HTTP-PORT 80 FREIGEBEN
    # ==========================================================
    # ZWECK:   Erlaubt eingehende HTTP-Verbindungen auf Port 80.
    #
    # JEDER darf auf die Webseite zugreifen (keine src-Einschränkung)
    # → Das ist der Unterschied zum DB-Server (siehe Play 2)
    # ==========================================================
    - name: HTTP Port 80 freigeben
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    # ==========================================================
    # TASK 6: NGINX STARTEN UND FÜR AUTOSTART AKTIVIEREN
    # ==========================================================
    # ZWECK:   Startet Nginx sofort und stellt sicher, dass es
    #          beim Booten automatisch startet.
    # ==========================================================
    - name: Nginx starten und für Autostart aktivieren
      service:
        name: nginx
        state: started
        enabled: yes

    # ==========================================================
    # TASK 7: EIGENE INDEX.HTML ERSTELLEN
    # ==========================================================
    # ZWECK:   Erstellt eine eigene Webseite mit dynamischen Inhalten.
    #
    # content: | → Mehrzeiliger Text (YAML-Block-Skalar)
    #
    # DYNAMISCHE VARIABLEN (Ansible-Facts):
    #   {{ ansible_hostname }} → Hostname der VM
    #   {{ ansible_default_ipv4.address }} → Primäre IPv4-Adresse
    #
    # owner/group: www-data → Nginx-Benutzer auf Ubuntu
    # mode: '0644' → Leserechte für Nginx
    # ==========================================================
    - name: Eigene index.html erstellen
      copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>Web-Server - {{ ansible_hostname }}</title>
          </head>
          <body>
            <h1>Willkommen auf {{ ansible_hostname }}</h1>
            <p>Deployed von: randolph bluming</p>
            <p>IP-Adresse: {{ ansible_default_ipv4.address }}</p>
            <p>Automatisch konfiguriert via GitHub Actions + Ansible</p>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    # ==========================================================
    # TASK 8: NGINX VERIFIZIEREN
    # ==========================================================
    # ZWECK:   Prüft, ob Nginx auf Port 80 antwortet.
    #
    # uri-Modul → Ansible's eingebauter HTTP-Client
    # url: http://127.0.0.1 → Test von INNEN der VM (localhost)
    # status_code: 200 → Erwartet HTTP 200 OK
    #
    # register: nginx_check → Speichert Ergebnis für nächsten Task
    #
    # checkov:skip → Checkov-Ignorierung für internen Test
    # ==========================================================
    - name: Prüfen ob Nginx auf Port 80 antwortet
      # checkov:skip=CKV2_ANSIBLE_1: Interner Localhost-Test, HTTPS nicht nötig
      uri:
        url: http://127.0.0.1
        status_code: 200
      register: nginx_check
      tags:
        - verify

    # ==========================================================
    # TASK 9: ERGEBNIS AUSGEBEN
    # ==========================================================
    # ZWECK:   Zeigt das Testergebnis im Ansible-Output.
    #
    # debug: msg: | → Mehrzeilige Ausgabe im Log
    #   {{ nginx_check.url }} → Getestete URL
    #   {{ nginx_check.status }} → HTTP-Statuscode
    # ==========================================================
    - name: Nginx Status ausgeben
      debug:
        msg: |
          ✅ Nginx läuft erfolgreich!
          URL:    {{ nginx_check.url }}
          Status: {{ nginx_check.status }}
          Host:   {{ ansible_hostname }}
          IP:     {{ ansible_default_ipv4.address }}


# ============================================================
# PLAY 2: DB-SERVER KONFIGURATION
# ============================================================
# ZWECK:   Installiert und konfiguriert PostgreSQL.
#          Konfiguriert Netzwerkzugriff für Web-Server.
#          Aktiviert Firewall mit IP-basierter Einschränkung.
#
# BETRIFFT: Nur Gruppe "dbserver" aus inventory.ini
#
# WICHTIG: Eigenständiger Play – komplett unabhängig vom
#          Web-Server-Play oben. Keine Überschneidungen.
# ============================================================
- name: Basis-Setup DB-Server
  hosts: dbserver
  become: true

  tasks:

    # ==========================================================
    # TASK 1: PAKETLISTEN AKTUALISIEREN
    # ==========================================================
    # Gleiches Prinzip wie beim Web-Server-Play
    # ==========================================================
    - name: Paketlisten aktualisieren
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # ==========================================================
    # TASK 2: POSTGRESQL INSTALLIEREN
    # ==========================================================
    # name: postgresql (ohne Versionsnummer)
    #   → Installiert Standardversion aus Ubuntu 22.04
    #   → Aktuell PostgreSQL 14
    # ==========================================================
    - name: PostgreSQL installieren
      apt:
        name: postgresql
        state: present

    # ==========================================================
    # TASK 3: POSTGRESQL AUF ALLEN INTERFACES LAUSCHEN LASSEN
    # ==========================================================
    # ZWECK:   Erlaubt PostgreSQL, Verbindungen von außen anzunehmen.
    #
    # Standard: "listen_addresses = 'localhost'"
    # → Nur lokale Verbindungen möglich
    #
    # ÄNDERUNG: "listen_addresses = '*'"
    # → Lauscht auf allen Netzwerk-Interfaces
    #
    # lineinfile: Sucht nach regexp und ersetzt/ergänzt die Zeile
    # backup: yes → Sicherungskopie der Originaldatei
    #
    # WICHTIG: Dies öffnet nur die "Außentür" – wer reinkommt,
    #          entscheidet pg_hba.conf (siehe Task 4)
    # ==========================================================
    - name: PostgreSQL auf allen Interfaces lauschen lassen
      lineinfile:
        path: /etc/postgresql/14/main/postgresql.conf
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
        backup: yes
      notify: PostgreSQL neu starten

    # ==========================================================
    # TASK 4: WEB-SERVER-ZUGRIFF IN PG_HBA.CONF ERLAUBEN
    # ==========================================================
    # ZWECK:   Definiert, wer sich mit der Datenbank verbinden darf.
    #
    # listen_addresses öffnet nur die "Außentür" – pg_hba.conf
    # entscheidet, wer tatsächlich reinkommt.
    #
    # FORMAT: host    database    user    address    auth-method
    #         host    all         all     10.0.30.101/32 md5
    #
    # all/all → bewusst offen (noch kein eigener DB-User/DB,
    #           siehe Phase 5/Vault)
    # /32 → Nur EXAKT diese eine IP (Web-Server)
    # md5 → Passwort-Authentifizierung
    #
    # insertafter: EOF → Fügt am Ende der Datei ein
    # backup: yes → Sicherungskopie
    # ==========================================================
    - name: Web-Server-Zugriff in pg_hba.conf erlauben
      lineinfile:
        path: /etc/postgresql/14/main/pg_hba.conf
        line: "host    all    all    10.0.30.101/32    md5"
        insertafter: EOF
        backup: yes
      notify: PostgreSQL neu starten

    # ==========================================================
    # TASK 5: UFW FIREWALL AKTIVIEREN
    # ==========================================================
    # Gleiches Prinzip wie beim Web-Server
    # ==========================================================
    - name: UFW Firewall aktivieren
      ufw:
        state: enabled
        logging: 'on'

    # ==========================================================
    # TASK 6: SSH-PORT FREIGEBEN
    # ==========================================================
    # MUSS vor "ufw enable" stehen, sonst Aussperrung!
    # ==========================================================
    - name: SSH Port freigeben (damit wir nicht ausgesperrt werden!)
      ufw:
        rule: allow
        name: OpenSSH

    # ==========================================================
    # TASK 7: POSTGRESQL-PORT NUR FÜR WEB-SERVER FREIGEBEN
    # ==========================================================
    # ZWECK:   Erlaubt Zugriff auf Port 5432 NUR von Web-Server-IP.
    #
    # src: 10.0.30.101 → Nur diese Quell-IP darf verbinden
    #
    # DREI UNABHÄNGIGE EBENEN:
    #   1. listen_addresses = '*' (PostgreSQL lauscht überall)
    #   2. pg_hba.conf (erlaubt nur Web-Server-IP)
    #   3. UFW (Firewall blockiert alle anderen)
    #
    # → Defence in Depth: Mehrere Sicherheitsschichten
    # ==========================================================
    - name: PostgreSQL Port 5432 nur für web-server freigeben
      ufw:
        rule: allow
        port: '5432'
        proto: tcp
        src: 10.0.30.101

    # ==========================================================
    # TASK 8: POSTGRESQL STARTEN UND FÜR AUTOSTART AKTIVIEREN
    # ==========================================================
    - name: PostgreSQL starten und für Autostart aktivieren
      service:
        name: postgresql
        state: started
        enabled: yes

    # ==========================================================
    # TASK 9: HANDLER SOFORT AUSFÜHREN
    # ==========================================================
    # ZWECK:   Erzwingt die sofortige Ausführung der Handler.
    #
    # PROBLEM: Handler laufen standardmäßig erst am Play-Ende.
    #          Wir brauchen den Neustart aber JETZT, damit der
    #          folgende Test den aktuellen Zustand sieht.
    #
    # meta: flush_handlers → Führt alle gependingen Handler aus
    # ==========================================================
    - name: Sicherstellen, dass PostgreSQL-Neustart bereits erfolgt ist
      meta: flush_handlers

    # ==========================================================
    # TASK 10: POSTGRESQL VERIFIZIEREN
    # ==========================================================
    # pg_isready → Eingebautes PostgreSQL-Tool zur Statusprüfung
    # changed_when: false → Reiner Lese-Check, keine Veränderung
    # ==========================================================
    - name: Prüfen ob PostgreSQL bereit ist
      command: pg_isready
      register: pg_check
      changed_when: false
      tags:
        - verify

    # ==========================================================
    # TASK 11: ERGEBNIS AUSGEBEN
    # ==========================================================
    - name: PostgreSQL Status ausgeben
      debug:
        msg: |
          ✅ PostgreSQL-Check abgeschlossen!
          Ergebnis: {{ pg_check.stdout }}
          Host:     {{ ansible_hostname }}
          IP:       {{ ansible_default_ipv4.address }}

  # ============================================================
  # HANDLERS
  # ============================================================
  # ZWECK:   Aktionen, die bei Änderungen ausgeführt werden.
  #          Werden von notify: aus Tasks getriggert.
  #
  # WICHTIG: Name MUSS exakt mit notify: übereinstimmen
  #          (reine Textübereinstimmung)
  # ============================================================
  handlers:

    # ==========================================================
    # HANDLER: POSTGRESQL NEU STARTEN
    # ==========================================================
    # WIRD GETRIGGERT VON:
    #   - Task 3: listen_addresses ändern
    #   - Task 4: pg_hba.conf ändern
    #
    # state: restarted → Stoppt und startet PostgreSQL neu
    # ==========================================================
    - name: PostgreSQL neu starten
      service:
        name: postgresql
        state: restarted